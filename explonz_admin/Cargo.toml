[package]
name = "explonz_admin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos_router = { workspace = true }
leptos         = { workspace = true }
server_fn      = { version = "0.8", features = ["multipart"] }
leptos_axum    = { workspace = true, optional = true }
axum           = { workspace = true, optional = true }
tokio          = { workspace = true, optional = true }
explonz_shared = { path = "../explonz_shared", default-features = false }
sea-orm        = { workspace = true, optional = true }
serde          = { workspace = true }
tracing        = { workspace = true, optional = true }
anyhow         = { workspace = true, optional = true }
leptos_meta = {workspace = true}
tw_merge.workspace = true
icons.workspace = true
leptos_ui.workspace = true
strum.workspace = true
axum-extra = { workspace = true, features = ["cookie"], optional = true  }
wasm-bindgen = { version = "0.2.127", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
heck = "0.5"
# explonz_bnd = { path = "../../explonz_bnd" }
reqwest    = { workspace = true, optional = true }
serde_json = { workspace = true}
dotenvy = { workspace = true, optional = true }


[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
# web-sys 由 Leptos 传递依赖，但 FormData / FileList 等 feature 需显式声明
web-sys = { version = "0.3", features = [
    "FormData",          # 构造 multipart 数据传给 upload_photo server fn
    "File",              # 读取拖入/选择的文件对象
    "FileList",          # input.files() 返回类型
    "HtmlInputElement",  # event_target::<HtmlInputElement> 取 files()
    "DataTransfer",      # DragEvent.data_transfer()
] }


[features]
default = []
ssr = [
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:sea-orm",
    "dep:tracing",
    "dep:anyhow",
    "leptos/ssr",
    "explonz_shared/ssr",
    "dep:axum-extra",
    "dep:reqwest",
    "dep:dotenvy",
]
# hydrate = ["leptos/hydrate"]
hydrate = [
    "leptos/hydrate",
    "dep:wasm-bindgen",
    "dep:console_error_panic_hook",
]

[[bin]]
name = "explonz_admin"
required-features = ["ssr"]

[package.metadata.leptos]
tailwind-input-file = "style/input.css"
